name: test

on:
  pull_request:
    branches: [ "main" ]

permissions: {} # lock everything by default (least-privilege)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    strategy:
      matrix:
        test: [corset-bench,corset-racer,corset-test,unit-test]
        field: [BLS12_377,KOALABEAR_16,GF_8209]
        exclude:
          - { field: KOALABEAR_16, test: corset-racer }
          - { field: KOALABEAR_16, test: unit-test }
          - { field: GF_8209,      test: corset-bench }
          - { field: GF_8209,      test: corset-racer }
          - { field: GF_8209,      test: unit-test }
      fail-fast: false
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.24'
      - run: make ${{ matrix.test }}
        env:
          GOMAXPROCS: 8
          GOMEMLIMIT: 16GiB
          GOCORSET_FIELD: ${{ matrix.field }}
  zkc:
    permissions:
      contents: read
    strategy:
      matrix:
        test: [bench,util,unit,racer]
      fail-fast: false
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.24'
      - run: make zkc-${{ matrix.test }}-test
        env:
          GOMAXPROCS: 8
          GOMEMLIMIT: 16GiB
